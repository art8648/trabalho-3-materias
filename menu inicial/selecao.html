<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            color: #777;
            margin-bottom: 60px;
        }

        .characters {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        /* CARD DOS PERSONAGENS */

        .character {
            width: 230px;
            height: 340px;

            position: relative;
            overflow: hidden;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            background: #111;
            border: 1px solid #333;

            cursor: pointer;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
        }

        /* IMAGEM DE FUNDO */

        .character::before {
            content: "";
            position: absolute;
            inset: 0;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0.15;
            filter: grayscale(100%);

            transition:
                opacity 0.45s ease,
                filter 0.45s ease,
                transform 0.6s ease;
        }

        /* IMAGENS INDIVIDUAIS */

        .link::before {
            background-image: url("images/link.jpg");
        }

        .knight::before {
            background-image: url("images/knight.jpg");
        }

        .mereoleona::before {
            background-image: url("images/mereoleona.jpg");
        }

        /* ESCURECIMENTO PARA MANTER O TEXTO LEGÍVEL */

        .character::after {
            content: "";
            position: absolute;
            inset: 0;

            background: linear-gradient(
                to top,
                rgba(0,0,0,0.95),
                rgba(0,0,0,0.15) 65%,
                rgba(0,0,0,0.1)
            );

            pointer-events: none;
        }

        /* EFEITO HOVER */

        .character:hover {
            transform: scale(1.08);

            border-color: rgba(255,255,255,0.85);

            box-shadow:
                0 0 8px rgba(255,255,255,0.25),
                0 0 20px rgba(255,255,255,0.12);
        }

        .character:hover::before {
            opacity: 0.85;
            filter: grayscale(0%);
            transform: scale(1.08);
        }

        /* CORES INDIVIDUAIS */

        .link:hover {
            box-shadow:
                0 0 10px rgba(130,200,120,0.35),
                0 0 25px rgba(130,200,120,0.15);
        }

        .knight:hover {
            box-shadow:
                0 0 10px rgba(100,170,255,0.35),
                0 0 25px rgba(100,170,255,0.15);
        }

        .mereoleona:hover {
            box-shadow:
                0 0 10px rgba(255,100,40,0.35),
                0 0 25px rgba(255,100,40,0.15);
        }

        /* INFORMAÇÕES */

        .character-info {
            position: relative;
            z-index: 2;

            width: 100%;
            padding: 25px 10px;
        }

        .character-info h2 {
            font-size: 19px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .character-info p {
            margin-top: 8px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #aaa;
        }

        /* PERSONAGEM SELECIONADO */

        .character.selected {
            border-color: white;

            box-shadow:
                0 0 10px rgba(255,255,255,0.4),
                0 0 25px rgba(255,255,255,0.2);
        }

        .selection {
            margin-top: 55px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #888;
        }

        @media (max-width: 650px) {

            .characters {
                gap: 25px;
            }

            .character {
                width: 200px;
                height: 290px;
            }

        }
        /* BOTÃO DE CONFIRMAÇÃO */
    form {
        margin-top: 35px;
    }

    #confirmar {
        width: 180px;
        height: 65px;
        background: #222;
        color: white;
        border: 1px solid #444;
        font-size: 13px;
        letter-spacing: 3px;

        cursor: pointer;

        transition:
            background 0.35s ease,
            border-color 0.35s ease,
            box-shadow 0.35s ease,
            transform 0.35s ease;
    }
    /* EFEITO HOVER */
    #confirmar:hover:not(:disabled) {
        background: #333;
        border-color: rgba(255,255,255,0.85);
        box-shadow:
            0 0 8px rgba(255,255,255,0.25),
            0 0 20px rgba(255,255,255,0.12);
        transform: scale(1.05);
        }
    /* BOTÃO DESABILITADO */
    #confirmar:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    </style>
</head>

<body>

    <main class="container">

        <h1>Character Selection</h1>

        <p class="subtitle">
            CHOOSE YOUR CHARACTER
        </p>

        <section class="characters">

            <!-- LINK -->

            <div class="character link"
                onclick="selectCharacter(this, 'Link')">

                <div class="character-info">
                    <h2>Link</h2>
                    <p>THE LEGEND OF ZELDA</p>
                </div>

            </div>

            <!-- THE KNIGHT -->

            <div class="character knight"
                onclick="selectCharacter(this, 'The Knight')">

                <div class="character-info">
                    <h2>The Knight</h2>
                    <p>HOLLOW KNIGHT</p>
                </div>

            </div>

            <!-- MEREOLEONA -->

            <div class="character mereoleona"
                onclick="selectCharacter(this, 'Mereoleona')">

                <div class="character-info">
                    <h2>Mereoleona</h2>
                    <p>BLACK CLOVER</p>
                </div>

            </div>

        </section>

        <div class="selection" id="selection">
            NO CHARACTER SELECTED
        </div>
        <form action="../index.php?pagina=selecionar_personagem" method="POST">
            <input type="hidden" name="personagem" id="personagem" value="">
            <button type="submit" id="confirmar" disabled>CONFIRMAR</button>
        </form>
    </main>

    <script>

        function selectCharacter(element, name) {

            document.querySelectorAll('.character')
                .forEach(character => {
                    character.classList.remove('selected');
                });

            element.classList.add('selected');

            document.getElementById('selection').textContent =
                'SELECTED: ' + name.toUpperCase();
            document.getElementById('personagem').value = name;
            document.getElementById('confirmar').disabled = false;
        }

    </script>

</body>
</html>
