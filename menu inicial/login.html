<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou criar conta — Peakmon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!-- MUDOU: o caminho do CSS agora conta a pasta "menu inicial" -->
    <link rel="stylesheet" href="menu%20inicial/style.css">
</head>
<body>
    <main>
        <p style="text-align:center; margin: 18px 0;">
            <!-- MUDOU: o caminho do menu agora conta a pasta "menu inicial" -->
            <a href="menu%20inicial/menu.html">Voltar ao menu inicial</a>
        </p>
        <section class="container" id="signup">
            <h1 class="form-title">Cadastro</h1>

            <!-- Cadastro -->
            <!-- MUDOU: action sem o nome da pasta do seu colega -->
            <form action="auth.php" method="POST">
                <input type="hidden" name="acao" value="registrar">

                <div class="input-group">
                    <label for="cadastro-nome">Nome de usuário</label>
                    <input
                        type="text"
                        id="cadastro-nome"
                        name="nome"
                        maxlength="60"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="cadastro-senha">Senha</label>
                    <input
                        type="password"
                        id="cadastro-senha"
                        name="senha"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <hr>

        <section class="container" id="login">
            <h1 class="form-title">Entrar</h1>

            <!-- Login -->
            <!-- MUDOU: mesmo ajuste do action -->
            <form action="auth.php" method="POST">
                <input type="hidden" name="acao" value="entrar">

                <div class="input-group">
                    <label for="login-nome">Nome de usuário</label>
                    <input
                        type="text"
                        id="login-nome"
                        name="nome"
                        maxlength="60"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input
                        type="password"
                        id="login-senha"
                        name="senha"
                        required
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
