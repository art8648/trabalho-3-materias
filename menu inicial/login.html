<style>
    
/* Logo acima das caixas sem alterar o grid */
.logo-jogo { display:flex; justify-content:center; align-items:center; margin: 0 0 22px; }
.logo-jogo img { display:block; width: 50%; max-height: 250px; object-fit:contain; }

/* Formulários lado a lado, com tamanho igual */
.cadastro-layout { position: relative; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; gap:24px; width:100%; isolation:isolate; }
.cadastro-layout .container { position:relative; z-index:2; width:100%; min-width:0; height:100%; }
@media(max-width:650px) { .cadastro-layout { grid-template-columns:1fr; } }

    :root {
        --verde-claro: #8de0a5;
        --verde-destaque: #31cb5c;
        --azul-escuro: #263d49;
        --texto-claro: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
    }

    body {
        min-height: 100vh;
        padding: 35px 16px;
        /* Meio roxo (espacial/misterioso) no lugar do ciano; cobre os dois blocos de login e cadastro. */
        background: linear-gradient(
            90deg,
            rgb(26, 92, 143) 0%,
            rgb(106, 63, 168) 27%,
            rgb(106, 63, 168) 73%,
            rgb(45, 150, 110) 87%,
            rgb(63, 163, 41) 100%
        );
        font-family: monospace;
        color: var(--texto-claro);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Camada 1: o degrade roxo + brilho central + estrelinhas. */
    body::before,
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
    }
    body::before {
        background:
            radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 255, 255, .7), transparent),
            radial-gradient(1px 1px at 24% 72%, rgba(255, 255, 255, .55), transparent),
            radial-gradient(1.5px 1.5px at 33% 40%, rgba(255, 255, 255, .6), transparent),
            radial-gradient(1px 1px at 41% 12%, rgba(255, 255, 255, .6), transparent),
            radial-gradient(1.5px 1.5px at 58% 88%, rgba(255, 255, 255, .55), transparent),
            radial-gradient(1px 1px at 66% 26%, rgba(255, 255, 255, .65), transparent),
            radial-gradient(1.5px 1.5px at 74% 62%, rgba(255, 255, 255, .5), transparent),
            radial-gradient(1px 1px at 81% 14%, rgba(255, 255, 255, .45), transparent),
            radial-gradient(ellipse 38% 70% at 50% 50%, rgba(170, 120, 240, .30), transparent 70%),
            linear-gradient(
                90deg,
                rgb(26, 92, 143) 0%,
                rgb(106, 63, 168) 27%,
                rgb(106, 63, 168) 73%,
                rgb(45, 150, 110) 87%,
                rgb(63, 163, 41) 100%
            );
    }
    /* Camada 2: Bigolin controlado pelo Deoxys, bem escuro e apagado (multiply: o branco some, so o desenho escurece o roxo). */
    body::after {
        background: url('menu%20inicial/images/deoxys_bigolin.jpg') center / auto 112vh no-repeat;
        mix-blend-mode: multiply;
        filter: grayscale(1) contrast(1.6) blur(1.2px);
        opacity: .4;
    }

    main {
        width: 100%;
        max-width: 820px;
        position: relative;
        z-index: 1;
    }

    main > p {
        margin: 0 0 20px !important;
    }

    main > p a {
        display: inline-block;
        padding: 10px 18px;
        background: var(--azul-escuro);
        color: white;
        border: 2px solid var(--verde-claro);
        border-radius: 8px;
        text-decoration: none;
        font-size: 16px;
        transition: 0.3s;
    }

    main > p a:hover {
        background: var(--verde-destaque);
        color: #17252d;
        transform: scale(1.05);
    }

    .container {
        padding: 26px 30px;
        background: rgba(23, 37, 45, 0.92);
        border: 3px solid var(--verde-claro);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-title {
        margin: 0 0 24px;
        text-align: center;
        color: var(--verde-claro);
        font-size: 30px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 #10252c;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 17px;
        color: white;
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px;
        background: #17252d;
        border: 2px solid #609d85;
        border-radius: 7px;
        outline: none;
        color: white;
        font-family: monospace;
        font-size: 18px;
        transition: 0.25s;
    }

    .input-group input:focus {
        border-color: var(--verde-destaque);
        box-shadow: 0 0 12px rgba(49, 203, 92, 0.35);
    }

    form button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        background: var(--azul-escuro);
        color: white;
        border: 3px solid var(--verde-claro);
        border-radius: 8px;
        font-family: monospace;
        font-size: 21px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    form button:hover {
        background: var(--verde-destaque);
        color: #17252d;
        transform: scale(1.04);
        box-shadow: 0 0 18px rgba(49, 203, 92, 0.4);
    }

    form button:active {
        transform: scale(0.98);
    }

    /* Aviso de erro (senha ou nome errado, nome ja cadastrado...) */
    .aviso-erro {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: -8px 0 20px;
        padding: 12px 14px;
        background: rgba(168, 40, 27, 0.22);
        border: 2px solid #ff7b6b;
        border-radius: 8px;
        color: #ffd9d4;
        font-size: 16px;
        line-height: 1.35;
        animation: aviso-balanca .45s ease-in-out;
    }

    .aviso-erro::before {
        content: "⚠";
        flex: none;
        font-size: 22px;
        color: #ff9b8f;
    }

    @keyframes aviso-balanca {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-7px); }
        40% { transform: translateX(7px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
        .aviso-erro { animation: none; }
    }

    hr {
        border: none;
        height: 2px;
        margin: 25px 0;
        background: rgba(141, 224, 165, 0.5);
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 12px;
        }

        .container {
            padding: 22px 18px;
        }

        .form-title {
            font-size: 26px;
        }

        .input-group label {
            font-size: 16px;
        }
    }
</style>

</head>

<body>
    <main>

        <p style="text-align:center; margin: 18px 0; position:absolute; z-index:2; bottom: -100px; left:50%; transform:translateX(-50%);">
            <a href="menu%20inicial/menu.html">Voltar ao menu inicial</a>
        </p>

        <!-- Logo centralizada acima dos formulários -->
        <div class="logo-jogo">
            <img src="menu%20inicial/images/Nome absurdo.png" alt="Logo do Peakmon">
        </div>

        <!-- Formulários lado a lado -->
        <div class="cadastro-layout">

            <section class="container" id="signup">

                <h1 class="form-title">Cadastro</h1>

                <?php if (!empty($avisoCadastro)): ?>
                    <div class="aviso-erro" role="alert"><?= htmlspecialchars($avisoCadastro, ENT_QUOTES, 'UTF-8') ?></div>
                <?php endif; ?>

                <form action="index.php?pagina=auth"
                      method="POST">

                    <input type="hidden" name="acao" value="registrar">

                    <div class="input-group">
                        <label for="cadastro-nome">Nome de usuário</label>

                        <input
                            type="text"
                            id="cadastro-nome"
                            name="nome"
                            maxlength="60"
                            value="<?= !empty($avisoCadastro) ? htmlspecialchars($nomeDigitado ?? '', ENT_QUOTES, 'UTF-8') : '' ?>"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="cadastro-senha">Senha</label>

                        <input
                            type="password"
                            id="cadastro-senha"
                            name="senha"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit">Cadastrar</button>

                </form>

            </section>

        <!-- Login ao lado do cadastro -->
        <section class="container" id="login">

            <h1 class="form-title">Entrar</h1>

            <?php if (!empty($avisoLogin)): ?>
                <div class="aviso-erro" role="alert"><?= htmlspecialchars($avisoLogin, ENT_QUOTES, 'UTF-8') ?></div>
            <?php endif; ?>

            <form action="index.php?pagina=auth" method="POST">

                <input type="hidden" name="acao" value="entrar">

                <div class="input-group">
                    <label for="login-nome">Nome de usuário</label>

                    <input
                        type="text"
                        id="login-nome"
                        name="nome"
                        maxlength="60"
                        value="<?= !empty($avisoLogin) ? htmlspecialchars($nomeDigitado ?? '', ENT_QUOTES, 'UTF-8') : '' ?>"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="login-senha">Senha</label>

                    <input
                        type="password"
                        id="login-senha"
                        name="senha"
                        required
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>

        </section>
        </div>
        
    </main>
</body>
</html>
