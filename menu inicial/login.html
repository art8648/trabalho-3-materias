<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou criar conta — Peakmon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
<style>
    
/* Cadastro com Pokémon nas laterais */
.cadastro-layout {
    position: relative;
    width: 100%;
    isolation: isolate;
}

.cadastro-layout #signup {
    position: relative;
    z-index: 2;
    width: 100%;
}

/* Estilo geral dos Pokémon */
.pokemon-lateral {
    position: absolute;
    width: 75%;
    height: 100%;
    right: -30%;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.6;
}

/* Pokémon azul */
.pokemon-esquerda {
    right: calc(100% + 15px);
}

/* Rayquaza */
.pokemon-direita {
    left: calc(100% + 15px);
}

/* Ajustes para telas menores */
@media (max-width: 1100px) {
    .pokemon-lateral {
        width: 22vw;
    }
}

@media (max-width: 750px) {
    .pokemon-lateral {
        display: none;
    }
}
    
    :root {
        --verde-claro: #8de0a5;
        --verde-destaque: #31cb5c;
        --azul-escuro: #263d49;
        --texto-claro: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
    }

    body {
        min-height: 100vh;
        padding: 35px 16px;
        background: linear-gradient(
            90deg,
            rgba(26, 92, 143, 1) 0%,
            rgba(46, 166, 134, 1) 33%,
            rgba(34, 181, 139, 1) 50%,
            rgba(51, 181, 81, 1) 64%,
            rgba(63, 163, 41, 1) 100%
        );
        font-family: 'Pixelify Sans', monospace;
        color: var(--texto-claro);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    main {
        width: 100%;
        max-width: 470px;
        position: relative;
        z-index: 1;
    }

    main > p {
        margin: 0 0 20px !important;
    }

    main > p a {
        display: inline-block;
        padding: 10px 18px;
        background: var(--azul-escuro);
        color: white;
        border: 2px solid var(--verde-claro);
        border-radius: 8px;
        text-decoration: none;
        font-size: 16px;
        transition: 0.3s;
    }

    main > p a:hover {
        background: var(--verde-destaque);
        color: #17252d;
        transform: scale(1.05);
    }

    .container {
        padding: 26px 30px;
        background: rgba(23, 37, 45, 0.92);
        border: 3px solid var(--verde-claro);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-title {
        margin: 0 0 24px;
        text-align: center;
        color: var(--verde-claro);
        font-size: 30px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 #10252c;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 17px;
        color: white;
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px;
        background: #17252d;
        border: 2px solid #609d85;
        border-radius: 7px;
        outline: none;
        color: white;
        font-family: 'Pixelify Sans', monospace;
        font-size: 18px;
        transition: 0.25s;
    }

    .input-group input:focus {
        border-color: var(--verde-destaque);
        box-shadow: 0 0 12px rgba(49, 203, 92, 0.35);
    }

    form button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        background: var(--azul-escuro);
        color: white;
        border: 3px solid var(--verde-claro);
        border-radius: 8px;
        font-family: 'Pixelify Sans', monospace;
        font-size: 21px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    form button:hover {
        background: var(--verde-destaque);
        color: #17252d;
        transform: scale(1.04);
        box-shadow: 0 0 18px rgba(49, 203, 92, 0.4);
    }

    form button:active {
        transform: scale(0.98);
    }

    hr {
        border: none;
        height: 2px;
        margin: 25px 0;
        background: rgba(141, 224, 165, 0.5);
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 12px;
        }

        .container {
            padding: 22px 18px;
        }

        .form-title {
            font-size: 26px;
        }

        .input-group label {
            font-size: 16px;
        }
    }
</style>

</head>

<body>
    <main>

        <p style="text-align:center; margin: 18px 0;">
            <a href="menu.html">Voltar ao menu inicial</a>
        </p>

        <!-- Cadastro com os Pokémon nas laterais -->
        <div class="cadastro-layout">

            <img
                src="images/deus.png"
                alt="Pokémon da esquerda"
                class="pokemon-lateral pokemon-esquerda"
            >

            <section class="container" id="signup">

                <h1 class="form-title">Cadastro</h1>

                <form action="/trabalho-3-materias/auth.php"
                      method="POST">

                    <input type="hidden" name="acao" value="registrar">

                    <div class="input-group">
                        <label for="cadastro-nome">
                            Nome de usuário
                        </label>

                        <input
                            type="text"
                            id="cadastro-nome"
                            name="nome"
                            maxlength="60"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="cadastro-senha">Senha</label>

                        <input
                            type="password"
                            id="cadastro-senha"
                            name="senha"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit">Cadastrar</button>

                </form>

            </section>

            <img
                src="images/rayquaza.png"
                alt="Rayquaza"
                class="pokemon-lateral pokemon-direita"
            >

        </div>

        <hr>

        <!-- Login separado do cadastro -->
        <section class="container" id="login">

            <h1 class="form-title">Entrar</h1>

            <form action="/trabalho-3-materias/auth.php"
                  method="POST">

                <input type="hidden" name="acao" value="entrar">

                <div class="input-group">
                    <label for="login-nome">Nome de usuário</label>

                    <input
                        type="text"
                        id="login-nome"
                        name="nome"
                        maxlength="60"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="login-senha">Senha</label>

                    <input
                        type="password"
                        id="login-senha"
                        name="senha"
                        required
                    >
                </div>

                <button type="submit">Entrar</button>

            </form>

        </section>

    </main>
</body>
</html>
